<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasbeeh Counter</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1e3c72, #0f2027);
  height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}

/* Glass container */
.container {
  background: rgba(255,255,255,0.08);
  -webkit-backdrop-filter: blur(15px);
  backdrop-filter: blur(15px);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  text-align: center;
  width: 340px;
}

/* Title glow */
h1 {
  margin-bottom: 10px;
  text-shadow: 0 0 10px rgba(0,198,255,0.6);
}

/* Dhikr text */
h2 {
  margin: 10px 0;
  font-size: 22px;
  color: #00e5ff;
  transition: 0.3s;
}

/* Counter with glow */
.counter {
  font-size: 55px;
  margin: 20px 0;
  font-weight: bold;
  text-shadow: 0 0 15px rgba(0,198,255,0.6);
}

/* Buttons */
button {
  padding: 12px 22px;
  margin: 10px 5px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 5px 15px rgba(0,198,255,0.3);
}

button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 20px rgba(0,198,255,0.5);
}

/* Progress bar container */
.progress {
  width: 100%;
  height: 14px;
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  margin-top: 20px;
  overflow: hidden;
  box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
}

/* Progress fill */
.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00c6ff, #00ffcc);
  transition: width 0.4s ease;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🕌 Tasbeeh Counter</h1>
<h2 id="currentDhikr">SubhanAllah</h2>

<div class="counter" id="count">0</div>

<button onclick="increment()">Count</button>
<button onclick="resetCounter()">Reset</button>

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

</div>

<audio id="clickSound" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
let count = 0;
let total = 100;

function increment() {
  count++;
  document.getElementById("count").textContent = count;

  document.getElementById("clickSound").play();

  let progress = (count / total) * 100;
  document.getElementById("progressBar").style.width = progress + "%";

  if (count <= 33) {
    document.getElementById("currentDhikr").textContent = "SubhanAllah";
  } else if (count <= 66) {
    document.getElementById("currentDhikr").textContent = "Alhamdulillah";
  } else {
    document.getElementById("currentDhikr").textContent = "Allahu Akbar";
  }

  if (count >= 100) {
    setTimeout(() => {
      alert("Tasbeeh Completed! 🌙");
      resetCounter();
    }, 200);
  }
}

function resetCounter() {
  count = 0;
  document.getElementById("count").textContent = count;
  document.getElementById("currentDhikr").textContent = "SubhanAllah";
  document.getElementById("progressBar").style.width = "0%";
}
</script>

</body>
</html>
